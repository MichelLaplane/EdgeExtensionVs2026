<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Edge Extension</title>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 10px 0;
      color: #333;
    }
    p {
      font-size: 14px;
      color: #666;
      margin: 0 0 15px 0;
    }
    button {
      background-color: #0078d4;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
    }
    button:hover {
      background-color: #106ebe;
    }
    #status {
      margin-top: 15px;
      font-size: 12px;
      color: #28a745;
    }
  </style>
</head>
<body>
  <h1>Simple Edge Extension</h1>
  <p>Welcome to your Edge extension!</p>
  <button id="clickButton">Click Me</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
